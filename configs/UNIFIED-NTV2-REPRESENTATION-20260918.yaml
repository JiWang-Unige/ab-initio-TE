    extraction: {job: 12889676, dependency: "afterok:12889091", partition: private-teodoro-gpu, gpu: nvidia_geforce_rtx_3090, cpus: 4, memory_gb: 48, walltime: "00:45:00"}
    evaluation: {jobs: [12889677, 12889678, 12889679, 12889680], dependency: "afterok:12889676", partition: debug-cpu, cpus: 4, memory_gb: 16, walltime: "00:15:00"}
